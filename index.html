<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P&L</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:rgba(255,255,255,0.06);
      --card2:rgba(255,255,255,0.08);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.65);
      --stroke:rgba(255,255,255,0.12);
      --shadow:0 10px 30px rgba(0,0,0,0.35);
      --radius:18px;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      --pos:#8cffbe;
      --neg:#ff8c8c;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(100,170,255,0.18), transparent 55%),
        radial-gradient(900px 700px at 90% 30%, rgba(180,120,255,0.14), transparent 60%),
        var(--bg);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:22px 18px 48px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
    }

    h1{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
    }

    .pill{
      padding:8px 12px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,0.04);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
    }

    .card{
      background:linear-gradient(180deg,var(--card2),var(--card));
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }

    .card h2{
      margin:0 0 10px;
      font-size:14px;
      color:rgba(255,255,255,0.86);
      font-weight:650;
      letter-spacing:.2px;
    }

    .table-wrap{
      max-height:620px;
      overflow:auto;
      border-radius:14px;
      border:1px solid var(--stroke);
    }

    .table{
      width:100%;
      border-collapse:collapse;
      border:0;
    }

    .table thead th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      padding:10px;
      border-bottom:1px solid var(--stroke);
      background:rgba(255,255,255,0.04);
      position:sticky;
      top:0;
      z-index:1;
      white-space:nowrap;
    }

    .table tbody td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      font-size:13px;
      white-space:nowrap;
    }

    .table tbody tr:hover{background:rgba(255,255,255,0.04)}

    .right{text-align:right}
    .pos{color:var(--pos);font-family:var(--mono)}
    .neg{color:var(--neg);font-family:var(--mono)}
    .mono{font-family:var(--mono)}

    .table thead th.sortable{cursor:pointer;user-select:none}
    .table thead th.sortable:hover{background:rgba(255,255,255,0.06)}
    .sort-ind{opacity:.7;margin-left:6px;font-size:11px}

    @media (max-width:720px){
      header{align-items:flex-start;flex-direction:column}
      .wrap{padding:18px 12px 36px}
    }
  </style>
</head>

<body>
<div class="wrap">
  <header>
    <h1></h1>
    <div class="pill" id="asOf">Prezzi aggiornati al: -</div>
  </header>

  <section class="card">
    <h2></h2>
    <div class="table-wrap">
      <table class="table" id="tbl">
        <thead>
          <tr>
            <th class="sortable" data-key="Ticker">Ticker<span class="sort-ind"></span></th>
            <th class="sortable" data-key="Name">Nome<span class="sort-ind"></span></th>
            <th class="sortable" data-key="Asset">Asset<span class="sort-ind"></span></th>
            <th class="sortable" data-key="DataAcquisto">Data Acq.<span class="sort-ind"></span></th>
            <th class="right sortable" data-key="Entry">Entry<span class="sort-ind"></span></th>
            <th class="right sortable" data-key="Current">Attuale<span class="sort-ind"></span></th>
            <th class="right sortable" data-key="PnL">P&L da acquisto<span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const DATA = {
  asOf: "05-20-2026",

  table: [
    { Ticker:"MIGA.SG", Name:"MicroStrategy", Asset:"Stock", DataAcquisto:"03/03/2026", Entry:113.77, Current:144.40 },
    { Ticker:"SIDU", Name:"Sidus Space", Asset:"Stock", DataAcquisto:"31/12/2025", Entry:2.58, Current:3.6000 },
    { Ticker:"6RJ0.MU", Name:"Rocket Lab", Asset:"Stock", DataAcquisto:"16/12/2025", Entry:52.28, Current:109.80 },
    { Ticker:"1810.HK", Name:"Xiaomi HK", Asset:"Stock", DataAcquisto:"02/12/2025", Entry:57.90, Current:30.140 },
    { Ticker:"AHLA.DE", Name:"Alibaba", Asset:"Stock", DataAcquisto:"10/12/2025", Entry:134.49, Current:117.20 },
    { Ticker:"EMAAR.AE", Name:"Emaar Properties", Asset:"Stock", DataAcquisto:"23/10/2025", Entry:13.90, Current:11.18 },
    { Ticker:"ABEC.DE", Name:"Alphabet / Google", Asset:"Stock", DataAcquisto:"05/01/2026", Entry:271.88, Current:332.50 },
    { Ticker:"MFEA.MI", Name:"Media for Europe", Asset:"Stock", DataAcquisto:"01/12/2025", Entry:3.04, Current:2.8980 },
    { Ticker:"TLO.DE", Name:"Tesla", Asset:"Stock", DataAcquisto:"10/12/2025", Entry:388.78, Current:352.55 },
    { Ticker:"BZ=F", Name:"Brent Oil", Asset:"Commodity", DataAcquisto:"07/05/2026", Entry:97.82, Current:106.20 },
    { Ticker:"WNUC.DE", Name:"WisdomTree Uranium and Nuclear Energy UCITS ETF - USD Acc", Asset:"ETF", DataAcquisto:"12/12/2026", Entry:45.49, Current:49 }
  ]
};

const fmt = (x, d=2) => Number(x).toLocaleString('it-IT', {
  minimumFractionDigits:d,
  maximumFractionDigits:d
});

const fmtPct = (x) => {
  const n = Number(x);
  if (!isFinite(n)) return "-";
  return `${n >= 0 ? '+' : ''}${fmt(n)}%`;
};

const fmtSmart = (x) => {
  const n = Number(x);
  if (!isFinite(n)) return "-";
  const a = Math.abs(n);

  if (a !== 0 && a < 1) {
    return n.toLocaleString('it-IT', {
      minimumFractionDigits:3,
      maximumFractionDigits:6
    });
  }

  return n.toLocaleString('it-IT', {
    minimumFractionDigits:0,
    maximumFractionDigits:3
  });
};

const parseITDate = (s) => {
  if (!s) return null;
  const parts = String(s).split('/');
  if (parts.length !== 3) return null;
  let [dd, mm, yyyy] = parts.map(v => parseInt(v, 10));
  if (!dd || !mm || !yyyy) return null;
  if (yyyy < 100) yyyy += 2000;
  return new Date(yyyy, mm - 1, dd).getTime();
};

const computePnL = (entry, current) => {
  const e = Number(entry);
  const c = Number(current);
  if (!isFinite(e) || e === 0 || !isFinite(c)) return null;
  return ((c - e) / e) * 100;
};

const getComparable = (row, key) => {
  const v = row[key];
  if (key === 'DataAcquisto') return parseITDate(v) ?? -Infinity;
  if (['Entry','Current','PnL'].includes(key)) return Number(v) || 0;
  return (v ?? '').toString().toLowerCase();
};

DATA.table.forEach(r => {
  r.PnL = computePnL(r.Entry, r.Current);
});

document.getElementById('asOf').textContent = `Prezzi aggiornati al: ${DATA.asOf}`;

const tbody = document.querySelector('#tbl tbody');
const headers = Array.from(document.querySelectorAll('#tbl thead th.sortable'));

let sortKey = 'PnL';
let sortDir = 'desc';

function setIndicators() {
  headers.forEach(th => {
    const ind = th.querySelector('.sort-ind');
    if (!ind) return;
    ind.textContent = th.dataset.key === sortKey ? sortDir === 'asc' ? '▲' : '▼' : '';
  });
}

function renderTable() {
  tbody.innerHTML = '';

  const sorted = DATA.table.slice().sort((a,b) => {
    const A = getComparable(a, sortKey);
    const B = getComparable(b, sortKey);
    if (A < B) return sortDir === 'asc' ? -1 : 1;
    if (A > B) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  sorted.forEach(r => {
    const tr = document.createElement('tr');
    const pnlVal = Number(r.PnL) || 0;
    const pnlClass = pnlVal >= 0 ? 'pos' : 'neg';

    tr.innerHTML =
      `<td class="mono">${r.Ticker}</td>` +
      `<td>${r.Name}</td>` +
      `<td>${r.Asset}</td>` +
      `<td class="mono">${r.DataAcquisto || ''}</td>` +
      `<td class="right mono">${fmtSmart(r.Entry)}</td>` +
      `<td class="right mono">${fmtSmart(r.Current)}</td>` +
      `<td class="right ${pnlClass}">${fmtPct(r.PnL)}</td>`;

    tbody.appendChild(tr);
  });

  setIndicators();
}

headers.forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (!key) return;

    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = ['Name','Ticker','Asset','DataAcquisto'].includes(key) ? 'asc' : 'desc';
    }

    renderTable();
  });
});

renderTable();
</script>
</body>
</html>
