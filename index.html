<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P&L</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:rgba(255,255,255,0.06);
      --card2:rgba(255,255,255,0.08);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.65);
      --stroke:rgba(255,255,255,0.12);
      --shadow:0 10px 30px rgba(0,0,0,0.35);
      --radius:18px;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      --pos:#8cffbe;
      --neg:#ff8c8c;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(100,170,255,0.18), transparent 55%),
        radial-gradient(900px 700px at 90% 30%, rgba(180,120,255,0.14), transparent 60%),
        var(--bg);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:22px 18px 48px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
    }

    h1{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
    }

    .pill{
      padding:8px 12px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,0.04);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
    }

    .card{
      background:linear-gradient(180deg,var(--card2),var(--card));
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }

    .closed-section{
      margin-top:18px;
    }

    .card h2{
      margin:0 0 10px;
      font-size:14px;
      color:rgba(255,255,255,0.86);
      font-weight:650;
      letter-spacing:.2px;
    }

    .table-wrap{
      max-height:620px;
      overflow:auto;
      border-radius:14px;
      border:1px solid var(--stroke);
    }

    .table{
      width:100%;
      border-collapse:collapse;
      border:0;
    }

    .table thead th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      padding:10px;
      border-bottom:1px solid var(--stroke);
      background:rgba(255,255,255,0.04);
      position:sticky;
      top:0;
      z-index:1;
      white-space:nowrap;
    }

    .table tbody td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      font-size:13px;
      white-space:nowrap;
    }

    .table tbody tr:hover{background:rgba(255,255,255,0.04)}

    .right{text-align:right}
    .pos{color:var(--pos);font-family:var(--mono)}
    .neg{color:var(--neg);font-family:var(--mono)}
    .mono{font-family:var(--mono)}
    .tx-link{color:var(--text);text-decoration:none}
    .tx-link:hover{text-decoration:underline}

    .table thead th.sortable{cursor:pointer;user-select:none}
    .table thead th.sortable:hover{background:rgba(255,255,255,0.06)}
    .sort-ind{opacity:.7;margin-left:6px;font-size:11px}

    @media (max-width:720px){
      header{align-items:flex-start;flex-direction:column}
      .wrap{padding:18px 12px 36px}
    }
  </style>
</head>

<body>
<div class="wrap">
  <header>
    <h1>Portafoglio iniziato il 20/06/26</h1>
    <div class="pill" id="asOf">Prezzi aggiornati al: -</div>
  </header>

  <section class="card">
    <h2></h2>
    <div class="table-wrap">
      <table class="table" id="tbl">
        <thead>
          <tr>
            <th class="sortable" data-key="Ticker">Ticker<span class="sort-ind"></span></th>
            <th class="sortable" data-key="Name">Nome<span class="sort-ind"></span></th>
            <th class="sortable" data-key="Asset">Asset<span class="sort-ind"></span></th>
            <th class="right sortable" data-key="Entry">Entry<span class="sort-ind"></span></th>
            <th class="right sortable" data-key="Current">Attuale<span class="sort-ind"></span></th>
            <th class="right sortable" data-key="PnL">P&L da acquisto<span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card closed-section">
    <h2>Trades chiuse</h2>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Direzione</th>
            <th>Apertura</th>
            <th>Chiusura</th>
            <th class="right">Entry</th>
            <th class="right">Exit</th>
            <th class="right">Profitto realizzato</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="mono">SPCX</td>
            <td>Short</td>
            <td><a class="tx-link mono" href="https://app.hyperliquid.xyz/explorer/tx/0x617bf7109e16321562f5043dedf3ca0214ef00f6391950e70544a2635d1a0c00" target="_blank" rel="noopener noreferrer">17/06/2026</a></td>
            <td><a class="tx-link mono" href="https://app.hyperliquid.xyz/explorer/tx/0x27d1715325a15f8a294b0441a698700205120038c0a47e5ccb9a1ca5e4a53974" target="_blank" rel="noopener noreferrer">07/08/2026</a></td>
            <td class="right mono">206,98</td>
            <td class="right mono">126,14</td>
            <td class="right pos">+39,06%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<script>
const DATA = {
  asOf: "25-08-2026",

  table: [
    { Ticker:"HYPE32196-USD", Name:"Hyperliquid USD", Asset:"Crypto", Entry:56.04, Current:81.79, PnL:44.33 },
    { Ticker:"SPOL.L", Name:"iShares MSCI Poland UCITS ETF USD (Acc)", Asset:"ETF", Entry:2771.00, Current:3098.50, PnL:11.40 },
    { Ticker:"1810.HK", Name:"Xiaomi Corporation", Asset:"Stock", Entry:25.400, Current:27.840, PnL:7.192 },
    { Ticker:"BZ=F", Name:"Brent Crude Oil Last Day Financial Futures", Asset:"Futures", Entry:90.20, Current:90.21, PnL:1.10 },
    { Ticker:"SPCX", Name:"Space Exploration Technologies Corp.", Asset:"Stock", Entry:136.23, Current:135.00, PnL:-2.00 },
    { Ticker:"CL=F", Name:"Crude Oil Oct 26", Asset:"Futures", Entry:81.70, Current:84.60, PnL:-2.40 },
    { Ticker:"GSIT", Name:"GSI Technology, Inc.", Asset:"Stock", Entry:6.82, Current:5.72, PnL:-18.01 },
    { Ticker:"POET", Name:"POET Technologies Inc.", Asset:"Stock", Entry:12.10, Current:7.75, PnL:-37.21 }
  ]
};

const fmt = (x, d=2) => Number(x).toLocaleString('it-IT', {
  minimumFractionDigits:d,
  maximumFractionDigits:d
});

const fmtPct = (x) => {
  const n = Number(x);
  if (!isFinite(n)) return "-";
  return `${n >= 0 ? '+' : ''}${fmt(n)}%`;
};

const fmtSmart = (x) => {
  const n = Number(x);
  if (!isFinite(n)) return "-";
  const a = Math.abs(n);

  if (a !== 0 && a < 1) {
    return n.toLocaleString('it-IT', {
      minimumFractionDigits:3,
      maximumFractionDigits:6
    });
  }

  return n.toLocaleString('it-IT', {
    minimumFractionDigits:0,
    maximumFractionDigits:3
  });
};

const computePnL = (entry, current) => {
  const e = Number(entry);
  const c = Number(current);
  if (!isFinite(e) || e === 0 || !isFinite(c)) return null;
  return ((c - e) / e) * 100;
};

const getComparable = (row, key) => {
  const v = row[key];
  if (['Entry','Current','PnL'].includes(key)) return Number(v) || 0;
  return (v ?? '').toString().toLowerCase();
};

DATA.table.forEach(r => {
  const providedPnL = Number(r.PnL);
  r.PnL = Number.isFinite(providedPnL) ? providedPnL : computePnL(r.Entry, r.Current);
});

document.getElementById('asOf').textContent = `Prezzi aggiornati al: ${DATA.asOf}`;

const tbody = document.querySelector('#tbl tbody');
const headers = Array.from(document.querySelectorAll('#tbl thead th.sortable'));

let sortKey = 'PnL';
let sortDir = 'desc';

function setIndicators() {
  headers.forEach(th => {
    const ind = th.querySelector('.sort-ind');
    if (!ind) return;
    ind.textContent = th.dataset.key === sortKey ? sortDir === 'asc' ? '▲' : '▼' : '';
  });
}

function renderTable() {
  tbody.innerHTML = '';

  const sorted = DATA.table.slice().sort((a,b) => {
    const A = getComparable(a, sortKey);
    const B = getComparable(b, sortKey);
    if (A < B) return sortDir === 'asc' ? -1 : 1;
    if (A > B) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  sorted.forEach(r => {
    const tr = document.createElement('tr');
    const pnlVal = Number(r.PnL) || 0;
    const pnlClass = pnlVal >= 0 ? 'pos' : 'neg';

    tr.innerHTML =
      `<td class="mono">${r.Ticker}</td>` +
      `<td>${r.Name}</td>` +
      `<td>${r.Asset}</td>` +
      `<td class="right mono">${fmtSmart(r.Entry)}</td>` +
      `<td class="right mono">${fmtSmart(r.Current)}</td>` +
      `<td class="right ${pnlClass}">${fmtPct(r.PnL)}</td>`;

    tbody.appendChild(tr);
  });

  setIndicators();
}

headers.forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (!key) return;

    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = ['Name','Ticker','Asset'].includes(key) ? 'asc' : 'desc';
    }

    renderTable();
  });
});

renderTable();
</script>
</body>
</html>
